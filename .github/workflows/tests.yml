name: tests

on:
  push:
  pull_request:
  workflow_dispatch:      # 也可以在 GitHub 页面上手动点一下跑

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 跑测试
        run: python -m pytest
